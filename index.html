<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Waon</title>
  </head>
  <body>
    <main class="app">
      <h1 class="title">Waon</h1>
      <p class="hint" id="hint"></p>

      <div class="toolbar">
        <button type="button" id="edit-toggle" class="tool">編集</button>
        <button type="button" id="rec" class="tool">● 録音</button>
        <button type="button" id="play" class="tool">▶ 再生</button>
        <button type="button" id="take-edit" class="tool">並び編集</button>
        <select id="takes" class="tool-select" aria-label="録音一覧"></select>
        <button type="button" id="save" class="tool">保存</button>
        <button type="button" id="download" class="tool">ダウンロード</button>
        <button type="button" id="delete" class="tool">削除</button>
        <button type="button" id="project-save" class="tool">プロジェクト保存</button>
        <button type="button" id="project-load" class="tool">プロジェクトロード</button>
        <input type="file" id="project-file" accept=".json,application/json" hidden />
      </div>

      <section id="pads" class="pads" aria-label="和音パッド"></section>

      <section id="editor" class="editor" aria-label="ボタンの編集" hidden>
        <input id="pad-name" class="pad-name" type="text" maxlength="10" aria-label="ボタン名" />
        <div id="roots" class="picker roots" aria-label="根音"></div>
        <div id="qualities" class="picker qualities" aria-label="コードの種類"></div>
        <div id="pad-notes" class="pad-notes"></div>
      </section>

      <section id="take-editor" class="take-editor" aria-label="録音の並び編集" hidden>
        <div class="take-row">
          <span class="label">全体</span>
          <button type="button" class="tool" data-transpose="-12">−8ve</button>
          <button type="button" class="tool" data-transpose="-1">−半音</button>
          <button type="button" class="tool" data-transpose="1">+半音</button>
          <button type="button" class="tool" data-transpose="12">+8ve</button>
        </div>
        <div id="roll" class="roll" aria-label="ピアノロール">
          <div id="roll-keys" class="roll-keys" aria-hidden="true"></div>
          <div id="roll-scroll" class="roll-scroll">
            <div id="roll-grid" class="roll-grid">
              <div id="playhead" class="playhead" hidden></div>
            </div>
          </div>
        </div>
        <div class="take-row">
          <span class="label">選択</span>
          <button type="button" class="tool" data-shift="-100">◀ 早く</button>
          <button type="button" class="tool" data-shift="100">遅く ▶</button>
          <button type="button" class="tool" data-length="-100">短く</button>
          <button type="button" class="tool" data-length="100">長く</button>
          <button type="button" class="tool" data-action="delete">削除</button>
        </div>
      </section>

      <section id="piano" class="piano" aria-label="ピアノ鍵盤"></section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
